version: '3.8'

services:
  # State DB: PostgreSQL (YugabyteDB compatible dialect)
  postgres:
    image: postgres:15-alpine
    container_name: microstream-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: microstream
    ports:
      - "5432:5432"
    volumes:
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microstream"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MicroStream Backend Service
  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    container_name: microstream-backend
    environment:
      PORT: 4000
      NODE_ENV: production
      LEDGER_ADAPTER_MODE: mock
      PAYOUT_ADAPTER_MODE: mock
      PAYMENT_ADAPTER_MODE: mock
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/microstream
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # MicroStream Frontend Service
  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend
    container_name: microstream-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
